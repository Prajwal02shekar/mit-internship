<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Apllication Form</legend>
            <label for="user">Username:</label>
            <input type="text" id="user" name="username" value="Prajwal" placeholder="Enter Username">
            <br><br>
            <label for="pwd">Passowrd:</label>
            <input type="password" id="pwd" name="password" placeholder="Enter Password">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter Email ID">
            <br><br>
            <label for="phNum">Ph Number:</label>
            <input type="tel" minlength="10" maxlength="10" placeholder="Enter Ph Number" id="phNum"><br><br>
            <label for="dob">Date of Birth</label>
            <input type="datetime-local"><br><br>
            <label for="age">Age:</label>
            <input type="number" placeholder="ENter Age" min="18" max="25"><br><br>
            <label for="address">Enter Address</label>
            <textarea></textarea>
            <br><br>
            <label for="gender">Select Gender</label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female
            <input type="radio" name="gender" value="others">Others
            <br><br>

            <label for="skills">Skills</label>
            <input type="checkbox" value="Java">Java
            <input type="checkbox" value="Python">Python
            <input type="checkbox" value="MERN" checked>MERN
            <br><br>
            <label for="states">Select States</label>
            <select name="" id="">
                <option value="Karnataka">Karnataka</option>
                <option value="Kerla">Kerla</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Andra Pradesh ">Andra Pradesh</option>
            </select>

            <!-- <input type="range">
            <input type="color" name="" id="">
            <input type="search" name="" id="">\
            <input type="url" name="" id=""> -->

            <label for="">Uplode image</label>
            <input type="file" name="" id="">
<br><br>
            
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </fieldset>
    </form>
</body>

</html>
