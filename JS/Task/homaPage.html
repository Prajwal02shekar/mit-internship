<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav{
            height: 60px;
            width: 100%;
            background-color: crimson;
            display: flex;
        }

        .logo{
            flex-basis: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .logo h2{
            font-size: 40px;
            font-weight: 200;
            font-style: italic;
        }
        .menu{
            flex-basis: 80%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
        }
        .menu a{

            font-size: larger;
            text-decoration: none;
            color: aliceblue;
        }
        .imgBlock img{
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
   <nav>
    <aside class="logo">
        <h2>MIT</h2>
    </aside>
    <aside class="menu">
        <a href="#">Home Page</a>
        <a href="#">Placements</a>
        <a href="#">Departments</a>
        <a href="#">Library</a>
    </aside>
    <aside class="imgBlock">
        <img src="" id="imageBlock" alt="">
    </aside>
   </nav>
</body>
<script src="./homaPage.js"></script>
</html>
