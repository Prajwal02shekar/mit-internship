<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <fieldset>
            <legend>Register</legend>
            <label for="username">Enter Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter Username"><br><br>
            <label for="email">Enter Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter Email"><br><br>

            <label for="password">Enter Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Password"><br><br>

            <label for="phNum">Enter Ph Number:</label>
            <input type="tel" id="phNum" name="phNum" placeholder="Enter phNum" minlength="10" maxlength="10"><br><br>

            <label for="imageUrl">Enter Image URL:</label>
            <input type="url" id="imageUrl" name="imageUrl" placeholder="Enter image Url"><br><br>

            <label for="dob">Enter DOB:</label>
            <input type="date" id="dob" name="dob" placeholder="Enter dob"><br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>





        </fieldset>
    </form>
</body>
<script src="./register.js"></script>
</html>
