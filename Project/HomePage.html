<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            background-color: crimson;
        }

        .logo {
            font-size: 20px;
            color: aliceblue;
            font-style: italic;
        }

        .nav-items {
            display: flex;
            align-items: center;
        }

        .nav-items a,
        .nav-items span {
            margin: 0 15px;
            text-decoration: none;
            color: antiquewhite;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-items a:hover,
        .nav-items span:hover {

            color: cornsilk;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            position: absolute;
            display: none;
            max-height: 150px;
            background-color: aliceblue;
            color: black;
            top: 20px;
            border-radius: 20px;
        }

        .dropdown-content a {
            display: block;
            padding: 5px;
            color: black;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .searchBox {
            display: flex;
            align-items: center;
            border-radius: 15px;
            overflow: hidden;
        }

        .searchBox input {
            padding: 8px 12px;
            border: none;
            border-radius: 15px;
            width: 280px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-right img {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            margin: 0 15px;
        }

        .firstContainer {
            padding: 50px;
            background-color: rgb(197, 6, 44);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .leftContainer {
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }

        .leftContainer h3 {
            font-size: 40px;
            font-style: italic;
        }

        .leftContainer p {
            font-size: 30px;
        }

        .leftContainer button {
            height: 30px;
            border: none;
            width: 100px;
            border-radius: 10px;
        }

        .rightContainer img {
            height: 300px;
            width: 300px;
        }

        .categoryConatiner {
            display: flex;
            justify-content: center;
            margin: 20px;
        }

        .categoryConatiner .category {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px;
            padding: 10px 20px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 0 5px gray;
            width: 100px;
            transition: all 0.6s linear;

        }

        .featuresContainer {
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: white;
            padding: 20px;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 0 5px gray;
            transition: all 0.6s linear;
        }

        .featuresContainer aside:hover,
        .category:hover {
            transform: scale(1.1);
        }

        #productConatiner{
            /* height: 100vh;
            width: 100%; */

            margin: 10px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
            gap: 10px;

        }
        .productCard{
            height: 350px;
            width: 250px;
            border: 2px solid ;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 15px;
            box-shadow: 0 0 5px gray;
            transition: all 0.6s linear;

        }
        .productCard:hover{
            transform: scale(1.03);
        }

        .productCard img{
            height: 150px;
            width: 150px;
            border-radius: 25px;
        }
        .productCard button{
            height: 30px;
            width: 120px;
            border: none;
            background-color: orangered;
            color: aliceblue;
            border-radius: 10px;
            font-size: 18px;
        }
        .footer {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: crimson;
            color: aliceblue;

        }
    </style>
</head>

<body>
    <!-- navbar Container -->

    <nav class="navbar">
        <aside class="logo">
            <h2>Shopping Cart</h2>
        </aside>
        <aside class="nav-items">
            <a href="./HomePage.html">Home Page</a>
            <div class="dropdown">
                <span>Category</span>
                <div class="dropdown-content">
                    <a href="">Mobiles</a>
                    <a href="">Laptops</a>
                    <a href="">Watches</a>
                    <a href="">TV</a>
                </div>
            </div>
            <a href="">About Us</a>
        </aside>

        <aside class="searchBox">
            <input type="search" id="search" onkeyup="searchFilter()"  placeholder="Search a Product.....">
        </aside>

        <aside class="nav-right">
            <img src="" alt="Profile" id="profile">
            <a href="">Cart 🛒</a>
        </aside>
    </nav>

    <!-- 1st container -->
    <section class="firstContainer">
        <aside class="leftContainer">
            <h3>Big Billion Days 🔥</h3>
            <p>Flat 50% off on all Electronic Items</p>
            <button>Shop Now</button>
        </aside>
        <aside class="rightContainer">
            <img src="https://img.magnific.com/premium-photo/home-appliance-with-ribbons-discounts_252025-696.jpg?semt=ais_hybrid&w=740&q=80"
                alt="">
        </aside>
    </section>

    <!-- 2nd Container -->
    <section class="categoryConatiner">
        <aside class="category" onclick="searchCategory('All')">All</aside>
        <aside class="category" onclick="searchCategory('laptop')">Laptop</aside>
        <aside class="category" onclick="searchCategory('watch')">Watch</aside>
        <aside class="category" onclick="searchCategory('mobile')">Mobile</aside>
        <aside class="category" onclick="searchCategory('tv')">TV</aside>
    </section>

    <!-- Features Container -->
    <section class="featuresContainer">
        <aside class="features">24/7 Support</aside>
        <aside class="features">Free Delivery</aside>
        <aside class="features">COD</aside>
        <aside class="features">Return Policy</aside>
        <aside class="features">Silver Coins</aside>
    </section>

    <!-- Products Container -->

    <section id="productConatiner">
        
    </section>

    <!-- Footer -->

    <section class="footer">
        <h2>CopyRights @2026 </h2>
    </section>

</body>
<script src="./HomePage.js"></script>
</html>
