<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            height: 70px;
            width: 100%;
            background: linear-gradient(to right, #8e44ad, #c0392b);
            display: flex;
        }

        .logo {
            height: 70px;
            flex-basis: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            height: 60px;
            width: 60px;
            border-radius: 50%;
        }

        .menu {
            height: 70px;
            flex-basis: 75%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .menu a {
            font-size: larger;
            color: aliceblue;
            text-decoration: none;
        }

        .menu a:hover {
            border-bottom: 1px solid aliceblue;
        }

        .icons {
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            font-size: xx-large;
            color: aliceblue;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <aside class="logo">
            <img src="https://www.maharajainstituteofhealthsciences.com/images/og-img.jpg" alt="">
        </aside>
        <aside class="menu">
            <a href="">About Us</a>
            <a href="">Courses</a>
            <a href="">Placements</a>
            <a href="">Departments</a>
            <a href="">Contact Us</a>
        </aside>
        <aside class="icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-x-twitter"></i>
        </aside>
    </nav>
</body>

</html>
