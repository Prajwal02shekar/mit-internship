<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            height: 400px;
            width: 500px;
            border: 2px solid red;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        aside {
            height: 150px;
            width: 150px;
            border: 2px solid;
        }

        #c1 {
            background: linear-gradient(to bottom, red,green,white,blue,yellow);
        }

        #c2 {
            background: repeating-linear-gradient(to right,darkblue,lightblue,magenta,brown,greenyellow 25%);
        }

        #c3 {
            background: radial-gradient(purple,antiquewhite,black,lightblue);
        }

        #c4 {
           background: radial-gradient(red,yellow,red);
        }
        #c5{
            background: repeating-radial-gradient(yellow,orange 5px);
        }
        #c6{
            background: linear-gradient(orange 33.33%,white 33.33%,white 66.66%,green 66.66%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        div{
            height: 48px;
            width: 48px;
            border-radius: 50%;
            background: repeating-conic-gradient(blue,white 3%);
        }

    </style>
</head>

<body>
    <section>
        <aside id="c1"></aside>
        <aside id="c2"></aside>
        <aside id="c3"></aside>
        <aside id="c4"></aside>
        <aside id="c5"></aside>
        <aside id="c6">
            <div></div>
        </aside>
    </section>
</body>

</html>
