<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            border: 2px solid;
            display: inline;
        }
        i{
            border: 2px solid;
            display: block;
            height: 100px;
        }
        b{
            border: 2px solid;
            display: inline-block;
            height: 100px;

        }
        h4{
            border: 2px solid red;
            display: inline-block;
            height: 150px;
        }
    </style>
</head>
<body>
    <h2>HEading 2</h2>
    <br><br>
    <i>Italic tag</i>
    <br><br>
    <b>Bold tag</b>
    <br><br>
    <h4>Heading 4</h4>
</body>
</html>
